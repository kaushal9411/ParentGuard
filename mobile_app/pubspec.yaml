name: parental_monitor
description: Child device monitoring app — background GPS, app usage, notifications.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Local database (Drift = type-safe SQLite ORM) ─────────────────────────
  drift: ^2.18.0
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.23

  # ── Background tasks ──────────────────────────────────────────────────────
  workmanager: ^0.6.0

  # ── Location ──────────────────────────────────────────────────────────────
  geolocator: ^12.0.0

  # ── Permissions ───────────────────────────────────────────────────────────
  permission_handler: ^11.3.1

  # ── Device info / status ──────────────────────────────────────────────────
  battery_plus: ^5.0.3
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0

  # ── HTTP (future backend sync) ────────────────────────────────────────────
  dio: ^5.6.0

  # ── Utilities ─────────────────────────────────────────────────────────────
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  logger: ^2.4.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
