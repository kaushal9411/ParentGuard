plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Decode --dart-define values passed by `flutter run` so Kotlin services
// (TrackingForegroundService, NotificationSyncService, etc.) use the same
// BACKEND_URL as the Flutter/Dart layer. No more duplicate hardcoding.
def dartDefines = [:]
if (project.hasProperty('dart-defines')) {
    project.property('dart-defines').split(',').each { entry ->
        try {
            def decoded = new String(entry.bytes.decodeBase64(), 'UTF-8')
            def idx = decoded.indexOf('=')
            if (idx >= 0) dartDefines[decoded.substring(0, idx)] = decoded.substring(idx + 1)
        } catch (ignored) {
            def idx = entry.indexOf('=')
            if (idx >= 0) dartDefines[entry.substring(0, idx)] = entry.substring(idx + 1)
        }
    }
}
def backendUrl = dartDefines.getOrDefault('BACKEND_URL', 'http://localhost:3000')

android {
    namespace "com.parentalmonitor.child"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.parentalmonitor.child"
        minSdkVersion flutter.minSdkVersion       // Android 6.0 — covers ~99 % of active devices
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName

        buildConfigField "String", "BACKEND_URL", "\"${backendUrl}\""
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug   // replace with release keystore
            minifyEnabled false
        shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                         "proguard-rules.pro"
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    // FusedLocationProviderClient
    implementation "com.google.android.gms:play-services-location:21.2.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3"

    // Lifecycle service (for lifecycle-aware coroutine scope)
    implementation "androidx.lifecycle:lifecycle-service:2.7.0"

    // Core KTX
    implementation "androidx.core:core-ktx:1.12.0"

    // WorkManager (explicitly declared — already transitive via flutter_workmanager,
    // but declared here so we can reference WorkManager KTX APIs directly from Kotlin)
    implementation "androidx.work:work-runtime-ktx:2.9.0"
}
